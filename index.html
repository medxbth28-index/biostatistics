<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community Medicine MCQ | al_witify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf5e6; --bg2:#f4e9cf; --card:#fffdf7; --ink:#3b3226; --muted:#8a7d68;
  --accent:#c07a3f; --accent2:#7a9a7e; --line:#eadfc6;
  --ok:#4f9a6a; --okbg:#e3f3e8; --bad:#c4574b; --badbg:#fae6e2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.active{display:flex}

/* ---------- HOME ---------- */
#home{align-items:center;justify-content:center;text-align:center;padding:18px;gap:14px;overflow-y:auto}
.kicker{font-size:13px;color:var(--muted);letter-spacing:2px;font-weight:600}
h1.title{margin:0;font-size:clamp(24px,5.5vw,38px);font-weight:800;line-height:1.3}
h1.title small{display:block;font-size:.5em;color:var(--accent);font-weight:700;margin-top:2px;letter-spacing:1px}
.menu{display:flex;flex-direction:column;gap:11px;width:min(420px,100%);margin-top:6px}
.menu button{font-family:inherit;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:16px;padding:14px 18px;font-size:17px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 4px 14px rgba(120,90,40,.08);transition:transform .15s,box-shadow .15s,border-color .15s}
.menu button:hover,.menu button:active{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 20px rgba(192,122,63,.18)}
.menu .num{background:linear-gradient(135deg,var(--accent),#d9a15f);color:#fff;border-radius:10px;padding:2px 11px;font-size:14px}
.menu .cnt{font-size:12.5px;color:var(--muted);font-weight:600}
.credit{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:0}
.credit .by{font-size:12px;color:var(--muted);letter-spacing:3px;font-weight:600}
.credit .brand{font-family:'Pacifico',cursive;font-size:clamp(46px,13vw,78px);line-height:1.2;direction:ltr;
  background:linear-gradient(120deg,#c0562f,#e0953f 45%,#6f9a78);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 6px rgba(192,86,47,.22));animation:glow 4s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 3px 6px rgba(192,86,47,.2))}50%{filter:drop-shadow(0 5px 14px rgba(224,149,63,.45))}}

/* ---------- TOP BAR ---------- */
.bar{display:flex;align-items:center;gap:8px;padding:6px 10px;height:42px;flex:none}
.iconbtn{font-family:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);
  height:30px;min-width:30px;padding:0 10px;border-radius:15px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.iconbtn:active{transform:scale(.94)}
.bar .lt{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{background:var(--okbg);color:var(--ok);border-color:#cfe8d7}
.prog{height:4px;background:rgba(0,0,0,.06);flex:none;margin:0 10px;border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .35s ease;border-radius:4px}

/* ---------- QUESTION ---------- */
.stage{flex:1;min-height:0;overflow-y:auto;padding:0 12px;scroll-snap-type:y proximity;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scroll-behavior:smooth;scrollbar-width:none}
.stage::-webkit-scrollbar{display:none}
.slide{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;scroll-snap-align:start;scroll-snap-stop:normal;padding:12px 0}
.hint{margin-top:10px;font-size:12px;color:var(--muted);font-weight:700;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.6}50%{transform:translateY(5px);opacity:1}}
.card{width:min(760px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 18px 14px;
  box-shadow:0 8px 28px rgba(120,90,40,.10);direction:ltr;text-align:left;margin:0}
.q{font-size:clamp(16px,2.6vw,20px);font-weight:700;line-height:1.55;margin-bottom:14px;font-family:'Cairo',sans-serif}
.opt{display:block;width:100%;text-align:left;font-family:inherit;font-size:clamp(14.5px,2.3vw,17px);line-height:1.5;
  background:#fff;border:1.5px solid var(--line);color:var(--ink);border-radius:13px;padding:11px 14px;margin-bottom:9px;cursor:pointer;
  transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not(:disabled){border-color:var(--accent);background:#fff8ec}
.opt:active:not(:disabled){transform:scale(.99)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:#245a38;font-weight:700}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:#8a2f25;font-weight:700;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{display:none;margin-top:4px;font-size:15px;font-weight:800;direction:rtl;text-align:center;padding:7px;border-radius:11px}
.fb.show{display:block;animation:pop .25s}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}

/* matching */
.legend{background:#fbf3e0;border:1px dashed #e0cfa6;border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:14px;line-height:1.5}
.legend div{margin:3px 0}
.mrow{border-top:1px solid var(--line);padding:9px 0}
.mrow .it{font-weight:700;margin-bottom:7px;font-size:15.5px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-family:inherit;font-weight:800;width:42px;height:38px;border-radius:11px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:15px;color:var(--ink)}
.chip:hover:not(:disabled){border-color:var(--accent);background:#fff8ec}
.chip:disabled{cursor:default}
.chip.ok{background:var(--okbg);border-color:var(--ok);color:#245a38}
.chip.bad{background:var(--badbg);border-color:var(--bad);color:#8a2f25;animation:shake .35s}

/* ---------- BOTTOM NAV ---------- */
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px 10px;flex:none}
.nbtn{font-family:inherit;border:none;border-radius:20px;height:36px;padding:0 20px;font-size:14px;font-weight:800;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#d9a15f);color:#fff;box-shadow:0 4px 10px rgba(192,122,63,.28)}
.nbtn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.nbtn:disabled{opacity:.35;cursor:default}
.nbtn:active:not(:disabled){transform:scale(.95)}
.pos{font-size:13px;font-weight:700;color:var(--muted);direction:ltr}

/* ---------- RESULT ---------- */
#result{align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px}
.rbox{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px 28px;box-shadow:0 10px 30px rgba(120,90,40,.12);width:min(400px,100%)}
.big{font-size:56px;font-weight:800;color:var(--accent);line-height:1.1}
.rbox p{margin:6px 0 16px;color:var(--muted);font-weight:600}
.rbox .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@media (max-height:520px){#home{justify-content:flex-start}.credit .brand{font-size:44px}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">

  <!-- HOME -->
  <section id="home" class="screen active">
    <div class="kicker">COMMUNITY MEDICINE · MCQ</div>
    <h1 class="title">اختبار الأسئلة التفاعلي<small>Biostatistics &amp; Community Medicine</small></h1>
    <div class="menu" id="menu"></div>
    <div class="credit">
      <span class="by">— DESIGNED BY —</span>
      <span class="brand">al_witify</span>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="screen">
    <div class="bar">
      <button class="iconbtn" id="backBtn" title="القائمة الرئيسية">⌂ رجوع</button>
      <div class="lt" id="lecTitle"></div>
      <div class="pos" id="pos"></div>
      <button class="iconbtn" id="sndBtn" title="الصوت">🔊</button>
      <div class="iconbtn score" id="score">✓ 0 / 0</div>
    </div>
    <div class="prog"><i id="pbar"></i></div>
    <div class="stage" id="stage"></div>
  </section>
</div>

<script>
/* ===================== DATA (من الملف الأصلي بدون أي تعديل) ===================== */
const LECTURES = [{"title": "L1 - المحاضرة الأولى", "qs": [{"t": "mcq", "q": "1. Which field of study is specifically concerned with drawing inferences (Analytic Statistics) about a body of data when only a part of it is observed?", "opts": ["A. Descriptive Statistics", "B. Biostatistics", "C. Analytic Statistics", "D. Public Health", "E. Epidemiology"], "ans": 2}, {"t": "mcq", "q": "2. A researcher is counting the number of hospital admissions. This variable is best classified as:", "opts": ["A. Continuous variable", "B. Nominal variable", "C. Ordinal variable", "D. Discrete variable", "E. Derived rate"], "ans": 3}, {"t": "mcq", "q": "3. The stage of a cancer (Stage 1, 2, or 3) is an example of which type of variable?", "opts": ["A. Nominal variable", "B. Ordinal variable", "C. Discrete variable", "D. Continuous variable", "E. Ratio"], "ans": 1}, {"t": "mcq", "q": "4. What is the primary difference between a ratio and a proportion?", "opts": ["A. A proportion involves time while a ratio does not.", "B. In a ratio, the numerator is always included in the denominator.", "C. In a proportion, the numerator is included in the denominator.", "D. Ratios are only used for qualitative data.", "E. Proportions are used to compare two unrelated quantities."], "ans": 2}, {"t": "mcq", "q": "5. Which sampling method involves choosing units from a sampling frame at a regular interval (e.g., every 12th unit)?", "opts": ["A. Simple random sampling", "B. Stratified random sampling", "C. Cluster sampling", "D. Systematic sampling", "E. Multi-stage sampling"], "ans": 3}, {"t": "mcq", "q": "6. A \"Sampling Frame\" is defined as:", "opts": ["A. The difference between a sample and a population.", "B. A numerical list of all units composing the study population.", "C. The process of dividing the population into strata.", "D. A subset of the population of entities.", "E. The chance of every member being included in a sample."], "ans": 1}, {"t": "mcq", "q": "7. Which sampling method is recommended for a very large population when a sampling frame for the entire population is not available?", "opts": ["A. Convenience sampling", "B. Quota sampling", "C. Simple random sampling", "D. Multi-stage sampling", "E. Systematic sampling"], "ans": 3}, {"t": "mcq", "q": "8. Why are results from non-probability sampling (like convenience sampling) considered inappropriate for certain research aims?", "opts": ["A. They are too expensive to collect.", "B. They always contain calculation mistakes.", "C. They are not valid even for the studied sample.", "D. They cannot be generalized to the underlying population.", "E. They do not require a sampling frame."], "ans": 3}, {"t": "mcq", "q": "9. What distinguishes a continuous variable from a discrete variable?", "opts": ["a. Continuous variables have more decimal places.", "b. Discrete variables possess gaps or interruptions in their values.", "c. Continuous variables can only take on integer values.", "d. Discrete variables have an infinite continuum of possible values.", "e. Continuous variables are measured in unusual units."], "ans": 1}, {"t": "mcq", "q": "10. In which category does the gender variable fall?", "opts": ["a. Continuous variable", "b. Nominal variable", "c. Ordinal variable", "d. Discrete variable", "e. Quantitative variable"], "ans": 1}, {"t": "mcq", "q": "11. Which of the following statements describes an ORDINAL variable?", "opts": ["a. Measurement categories are not ranked in a graded order.", "b. Differences among categories are always equal and measurable.", "c. Each measurement is assigned to one of a limitless number of categories.", "d. Differences among categories are not necessarily equal and often not measurable.", "e. Qualitative variables cannot be categorized."], "ans": 3}, {"t": "mcq", "q": "12. In the context of ratios, which of the following statements is accurate?", "opts": ["a. The numerator is always a component of the denominator.", "b. Ratios are not used for comparing quantities.", "c. Commonly used ratios include the ratio of people with tuberculosis to those without tuberculosis.", "d. Ratios cannot involve comparisons of male and female births.", "e. Maternal mortality ratio is an example of a ratio where the numerator is a component of the denominator."], "ans": 2}, {"t": "mcq", "q": "13. What does the term \"Statistical Inference\" refer to?", "opts": ["a. Making conclusions about a sample based on the results of studying a population.", "b. Making conclusions about a population of observations based on the results of studying a sample of these observations.", "c. Drawing conclusions about a population without studying any sample.", "d. Making predictions about future observations without studying any sample.", "e. The process of collecting statistical data."], "ans": 1}, {"t": "mcq", "q": "14. How would you best define \"Sampling Error\"?", "opts": ["a. It is an unintentional mistake in the sample selection process.", "b. It is the variability between different samples in a study.", "c. It is the difference between a sample measure and its corresponding population measure.", "d. It is a systematic error introduced during data analysis.", "e. It is the difference between the mean and median in a dataset."], "ans": 2}, {"t": "mcq", "q": "15. What is a characteristic feature of \"Probability Sampling\"?", "opts": ["a. The sample is selected without regard to the probability of each unit being chosen.", "b. The results of studying the sample are not generalizable to the underlying population.", "c. The sample is drawn based on convenience.", "d. The results of studying the sample are generalizable to the underlying population from which this sample had been drawn.", "e. Every unit in the population has an equal chance of being included in the sample."], "ans": 3}, {"t": "mcq", "q": "16. What limitation is highlighted regarding the structure of the sample in Simple Random Samples and Systematic Samples?", "opts": ["a. They can't ensure that the structure of the sample will be similar to the structure of the underlying population regarding certain characteristics, such as age and sex.", "b. They are ineffective for capturing age and sex characteristics in the sample.", "c. These methods guarantee an identical structure to the underlying population.", "d. The structure of the sample cannot be assessed.", "e. Age and sex characteristics are the only aspects captured effectively."], "ans": 0}, {"t": "mcq", "q": "17. Which of the following sampling methods involves selecting elements from a population based on ease of access?", "opts": ["a. Snowball sampling", "b. Purposive sampling", "c. Quota sample", "d. Convenience sampling", "e. Systematic sampling"], "ans": 3}, {"t": "mcq", "q": "18. When each member of a population has an equally likely chances of being selected, this is called:", "opts": ["a. A nonrandom sampling method.", "b. A quota sample.", "c. A snowball sample.", "d. A probability selection method", "e. A convenience sampling"], "ans": 3}, {"t": "mcq", "q": "19. Which of the following will give more accurate representation of the population from which a sample has been taken?", "opts": ["a. A large sample based on the convenience sampling technique.", "b. A small sample based on simple random sampling.", "c. A large sampling based on simple random sampling.", "d. A small cluster sample.", "e. All of the above."], "ans": 2}, {"t": "mcq", "q": "20. Which of the following sampling methods involves participants recruiting other participants they know?", "opts": ["a. Systematic sampling", "b. Purposive sampling", "c. Quota sampling", "d. Snowball sampling", "e. Cluster sampling"], "ans": 3}, {"t": "mcq", "q": "21. One limitation of using small samples for studying rare events is that:", "opts": ["a. They tend to provide too much information", "b. They may not yield sufficient cases for analysis", "c. They always produce biased results", "d. They require more resources to implement", "e. They are inherently more accurate than larger samples"], "ans": 1}, {"t": "mcq", "q": "22. What is a characteristic feature of \"Non-probability Sampling\"?", "opts": ["a. The sample is selected based on the probability of each unit being chosen.", "b. The results of studying the sample are generalizable to the underlying population.", "c. The sample is drawn using random selection methods.", "d. The results of studying the sample cannot be generalized to the underlying population from which this sample had been drawn.", "e. Every unit in the population has an equal chance of being included in the sample."], "ans": 3}, {"t": "mcq", "q": "23. What is required for the selection of a Simple Random Sample?", "opts": ["a. A sample frame and a sample fraction.", "b. A sample frame, sample fraction, and a list of distinct characteristics.", "c. A computer and a random number table.", "d. A sample frame and a list of potential errors.", "e. A lottery method and a sample fraction."], "ans": 0}, {"t": "mcq", "q": "24. Which of the following best describes the selection process in a Cluster Sample?", "opts": ["a. Individual units are randomly selected from the population.", "b. The sample is divided into strata based on specific characteristics.", "c. Groups of study units (clusters) are selected, and a random sample of these clusters is chosen.", "d. The selection involves proportional allocation from each cluster.", "e. The clusters are chosen based on their alphabetical order."], "ans": 2}, {"t": "mcq", "q": "25. Which of the following is an advantage of collecting information using samples?", "opts": ["a. Sampling increases demand on resources.", "b. Results are obtained more slowly with sampling.", "c. Sampling is not a feasible method for collecting information.", "d. Sampling reduces demand on resources (finance, personnel, materials).", "e. Sampling leads to a decrease in the accuracy of collected data."], "ans": 3}, {"t": "mcq", "q": "26. Which of the following is not a form of nonrandom sampling?", "opts": ["A. Snowball Sampling.", "B. Convenience Sampling.", "C. Quota Sampling.", "D. They Are All Forms Of Nonrandom Sampling."], "ans": 3}, {"t": "mcq", "q": "27. All of the following sampling techniques is an equal probability selection method (EPSEM) in which every individual in the population has an equal chance of being selected except:", "opts": ["a. Simple random.", "b. Systematic random sampling.", "c. Proportional stratified sampling.", "d. Quota sampling technique."], "ans": 3}, {"t": "mcq", "q": "28. is a set of elements taken from a larger population according to certain rules", "opts": ["A. Statistic", "B. Element", "C. Sample", "D. Population"], "ans": 2}, {"t": "mcq", "q": "29. The pH of gastric juice is a continuous variable.", "opts": ["a. true", "b. false"], "ans": 0}]}, {"title": "L2 - المحاضرة الثانية", "qs": [{"t": "mcq", "q": "30. If a dataset has 100 observations, how many class intervals would Sturgess' Rule suggest?", "opts": ["a. 6", "b. 10", "c. 7", "d. 8", "e. 12"], "ans": 3}, {"t": "mcq", "q": "31. If the width of each class interval is 8 and there are 6 class intervals, what is the range of the dataset?", "opts": ["a. 36", "b. 42", "c. 48", "d. 54", "e. 60"], "ans": 2}, {"t": "mcq", "q": "32. If a cumulative frequency for the first class interval is 10 and the second class interval has 15 observations, what is the cumulative frequency for the second class interval?", "opts": ["a. 10", "b. 15", "c. 25", "d. 5", "e. 30"], "ans": 2}, {"t": "mcq", "q": "33. What does a box plot primarily summarize?", "opts": ["a. categorical data", "b. qualitative data", "c. quantitative data", "d. temporal data", "e. nominal data"], "ans": 2}, {"t": "mcq", "q": "34. In a box plot, what does the line representing the 50th percentile indicate?", "opts": ["a. The first quartile", "b. The maximum value", "c. The minimum value", "d. The median", "e. The third quartile"], "ans": 3}, {"t": "mcq", "q": "35. A graph that uses vertical bars /* ===================== STATE ===================== */
const state = {lec:-1, idx:0, ans:[], sound:true};
const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); };

/* ===================== SOUND ===================== */
let AC=null;
function tone(freq,start,dur,type='sine',vol=.12){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,AC.currentTime+start);
  g.gain.setValueAtTime(0,AC.currentTime+start);
  g.gain.linearRampToValueAtTime(vol,AC.currentTime+start+.02);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+start+dur);
  o.connect(g); g.connect(AC.destination); o.start(AC.currentTime+start); o.stop(AC.currentTime+start+dur+.05);
}
function play(ok){
  if(!state.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    if(ok){ tone(660,0,.14); tone(990,.1,.2); }
    else { tone(220,0,.18,'triangle',.16); tone(150,.14,.26,'triangle',.16); }
  }catch(e){}
}
$('sndBtn').onclick=()=>{state.sound=!state.sound;$('sndBtn').textContent=state.sound?'🔊':'🔇'; if(state.sound)play(true);};

/* ===================== HOME ===================== */
LECTURES.forEach((l,i)=>{
  const b=document.createElement('button');
  const code=l.title.split(' - ')[0], name=l.title.split(' - ')[1]||l.title;
  b.innerHTML=`<span style="display:flex;align-items:center;gap:10px"><span class="num">${code}</span><span>${name}</span></span><span class="cnt">${l.qs.length} سؤال</span>`;
  b.onclick=()=>startLecture(i);
  $('menu').appendChild(b);
});

/* ===================== QUIZ (سكرولينج عمودي مثل فيسبوك) ===================== */
function startLecture(i){
  state.lec=i;
  const qs=LECTURES[i].qs;
  state.ans=qs.map(q=>q.t==='match'?{picks:{}}:{sel:null});
  $('lecTitle').textContent=LECTURES[i].title;
  const st=$('stage'); st.innerHTML='';
  qs.forEach((q,qi)=>{
    const s=document.createElement('div'); s.className='slide';
    s.appendChild(buildCard(qi));
    if(qi===0){const h=document.createElement('div'); h.className='hint'; h.textContent='اسحب للأسفل للسؤال التالي ⌄'; s.appendChild(h);}
    st.appendChild(s);
  });
  // شريحة النتيجة في آخر القائمة
  const fs=document.createElement('div'); fs.className='slide';
  fs.innerHTML=`<div class="rbox"><div style="font-weight:800;font-size:18px">النتيجة النهائية 🎉</div>
    <div class="big" id="rScore"></div><p id="rText"></p>
    <div class="row"><button class="nbtn" id="rRestart">إعادة المحاولة</button><button class="nbtn ghost" id="rHome">القائمة الرئيسية</button></div></div>`;
  st.appendChild(fs);
  fs.querySelector('#rRestart').onclick=()=>startLecture(state.lec);
  fs.querySelector('#rHome').onclick=()=>show('home');
  show('quiz'); st.style.scrollBehavior='auto'; st.scrollTop=0; setTimeout(()=>st.style.scrollBehavior='smooth',50);
  updateScore(); onScroll();
}
function isDone(qi){
  const q=LECTURES[state.lec].qs[qi], a=state.ans[qi];
  return q.t==='match' ? Object.keys(a.picks).length===q.items.length : a.sel!==null;
}
function isRight(qi){
  const q=LECTURES[state.lec].qs[qi], a=state.ans[qi];
  if(q.t==='match') return q.items.every(it=>{const n=it.match(/^\s*(\d+)/)[1]; return a.picks[n]===q.ans[n];});
  return a.sel===q.ans;
}
function updateScore(){
  const qs=LECTURES[state.lec].qs; let c=0, d=0;
  qs.forEach((_,i)=>{ if(isDone(i)){d++; if(isRight(i)) c++;} });
  $('score').textContent=`✓ ${c} / ${qs.length}`;
  const rs=$('rScore'); if(rs){
    const p=Math.round(c/qs.length*100);
    rs.textContent=`${c} / ${qs.length}`;
    $('rText').textContent=`نسبة النجاح ${p}%`+(d<qs.length?` — أجبت على ${d} من ${qs.length}`:(p>=85?' — ممتاز! 🌟':p>=60?' — جيد جداً 👏':' — حاول مرة ثانية 💪'));
  }
  return c;
}
function buildCard(qi){
  const q=LECTURES[state.lec].qs[qi], a=state.ans[qi];
  const card=document.createElement('div'); card.className='card';
  const qd=document.createElement('div'); qd.className='q'; qd.innerHTML=q.q; card.appendChild(qd);
  const fb=document.createElement('div'); fb.className='fb';

  if(q.t==='mcq'){
    q.opts.forEach((o,k)=>{
      const b=document.createElement('button'); b.className='opt'; b.innerHTML=o;
      b.onclick=()=>{
        if(a.sel!==null) return;
        a.sel=k;
        const right=(k===q.ans);
        [...card.querySelectorAll('.opt')].forEach((x,j)=>{x.disabled=true; if(j===q.ans)x.classList.add('ok'); else if(j===k)x.classList.add('bad');});
        setFb(fb,right); play(right); updateScore();
      };
      card.appendChild(b);
    });
  } else {
    const lg=document.createElement('div'); lg.className='legend';
    q.opts.forEach(o=>{const d=document.createElement('div'); d.innerHTML=o; lg.appendChild(d);});
    card.appendChild(lg);
    const letters=q.opts.map(o=>o.trim()[0].toLowerCase());
    q.items.forEach(it=>{
      const n=it.match(/^\s*(\d+)/)[1];
      const row=document.createElement('div'); row.className='mrow';
      const t=document.createElement('div'); t.className='it'; t.innerHTML=it; row.appendChild(t);
      const ch=document.createElement('div'); ch.className='chips';
      letters.forEach(L2=>{
        const c=document.createElement('button'); c.className='chip'; c.textContent=L2.toUpperCase();
        c.onclick=()=>{
          if(a.picks[n]) return;
          a.picks[n]=L2;
          const right=(L2===q.ans[n]);
          [...ch.children].forEach(x=>{x.disabled=true; const lx=x.textContent.toLowerCase(); if(lx===q.ans[n])x.classList.add('ok'); else if(lx===L2)x.classList.add('bad');});
          play(right); updateScore();
          if(isDone(qi)) setFb(fb,isRight(qi));
        };
        ch.appendChild(c);
      });
      row.appendChild(ch); card.appendChild(row);
    });
  }
  card.appendChild(fb);
  return card;
}
function setFb(el,right){
  el.className='fb show '+(right?'ok':'bad');
  el.textContent= right ? '✔ إجابة صحيحة' : '✘ إجابة خاطئة';
}
/* تحديث الشريط والعدّاد أثناء السكرول */
let tick=false;
function onScroll(){
  if(tick) return; tick=true;
  requestAnimationFrame(()=>{
    tick=false;
    const st=$('stage'), sl=st.children, N=LECTURES[state.lec].qs.length;
    let cur=0; const mid=st.scrollTop+st.clientHeight*0.5;
    for(let i=0;i<sl.length;i++){ if(sl[i].offsetTop<=mid) cur=i; }
    const shown=Math.min(cur+1,N);
    $('pos').textContent=`${shown} / ${N}`;
    $('pbar').style.width=(shown/N*100)+'%';
  });
}
$('stage').addEventListener('scroll',onScroll,{passive:true});
$('backBtn').onclick=()=>show('home');

/* ===================== FLOATING PARTICLES ===================== */
(function(){
  const cv=$('bg'), cx=cv.getContext('2d'); let W,H,P=[];
  const cols=['rgba(224,170,100,','rgba(150,185,150,','rgba(230,150,120,','rgba(200,170,220,','rgba(240,205,130,'];
  function size(){ const r=devicePixelRatio||1; W=cv.width=innerWidth*r; H=cv.height=innerHeight*r; cx.setTransform(1,0,0,1,0,0); cx.scale(r,r); W=innerWidth; H=innerHeight; }
  function mk(){ return {x:Math.random()*W,y:Math.random()*H,r:4+Math.random()*26,vx:(Math.random()-.5)*.35,vy:-.1-Math.random()*.4,
    c:cols[Math.floor(Math.random()*cols.length)],a:.12+Math.random()*.22,ph:Math.random()*6.28,sp:.005+Math.random()*.012}; }
  function init(){ size(); const n=Math.min(48,Math.round(W*H/22000)+14); P=Array.from({length:n},mk); }
  function loop(){
    const g=cx.createLinearGradient(0,0,W,H); g.addColorStop(0,'#fdf8ea'); g.addColorStop(1,'#f3e6c8');
    cx.fillStyle=g; cx.fillRect(0,0,W,H);
    P.forEach(p=>{
      p.ph+=p.sp; p.x+=p.vx+Math.sin(p.ph)*.25; p.y+=p.vy;
      if(p.y<-40){p.y=H+40;p.x=Math.random()*W} if(p.x<-40)p.x=W+40; if(p.x>W+40)p.x=-40;
      const gr=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
      gr.addColorStop(0,p.c+(p.a+.1)+')'); gr.addColorStop(1,p.c+'0)');
      cx.fillStyle=gr; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283); cx.fill();
    });
    requestAnimationFrame(loop);
  }
  addEventListener('resize',init); init(); loop();
})();
</script>
